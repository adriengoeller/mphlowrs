[package]
name = "mphlowrs"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Rust acceleration experiments for mechaphlowers"
publish = false

[lib]
name = "_mphlowrs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.30.1"
numpy = "0.30.0"

[features]
# Enabled by maturin only (pyproject.toml): with it, `cargo test` cannot link libpython.
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = "fat"
codegen-units = 1
