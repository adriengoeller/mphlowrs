[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "mphlowrs"
description = "Rust acceleration experiments for mechaphlowers"
requires-python = ">=3.11,<3.15"
license = "MPL-2.0"
dynamic = ["version"]
dependencies = ["numpy>=2.2.5,<3"]

[dependency-groups]
dev = [
    "maturin>=1.16,<2",
    "pytest>=8",
    # Local clone in vendor/ (see scripts/setup_vendor.sh), never pushed.
    "mechaphlowers",
]

[tool.maturin]
python-source = "python"
module-name = "mphlowrs._mphlowrs"

[tool.uv.sources]
mechaphlowers = { path = "vendor/mechaphlowers", editable = true }

[tool.uv]
# Rebuild the extension on `uv sync` / `uv run` when Rust sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
